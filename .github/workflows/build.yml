name: Build macOS App

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (universal)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (release, arm64)
        run: swift build -c release --arch arm64

      - name: Build (release, x86_64)
        run: swift build -c release --arch x86_64

      - name: Generate app icon
        continue-on-error: true
        run: |
          swift Scripts/generate_icon.swift build/icon_1024.png
          mkdir -p build/AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/icon_1024.png --out "build/AppIcon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d build/icon_1024.png --out "build/AppIcon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns

      - name: Package .app bundle (ad-hoc codesign)
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh
          codesign --verify --verbose=2 "build/UniAI.app"

      - name: Zip for distribution
        run: ditto -c -k --keepParent build/UniAI.app build/UniAI-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniAI-macOS
          path: build/UniAI-macOS.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: UniAI-macOS
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: UniAI-macOS.zip
